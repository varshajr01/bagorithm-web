services:
  - type: web
    name: bagorithm-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /welcome
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: bagorithm-db
          property: connectionString
      - key: REMEMBER_ME_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: ./uploads

databases:
  - name: bagorithm-db
    databaseName: bagorithm
    user: bagorithm
    plan: free
    region: oregon
    postgresMajorVersion: "16"