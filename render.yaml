services:
  - type: web
    name: bagorithm-web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /welcome
    disk:
      name: bagorithm-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: bagorithm-db
          property: connectionString
      - key: REMEMBER_ME_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads

databases:
  - name: bagorithm-db
    databaseName: bagorithm
    user: bagorithm
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
