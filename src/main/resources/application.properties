spring.application.name=bagorithm-web
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bagorithm_web}
spring.datasource.username=${DATABASE_USERNAME:bagorithm}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
bagorithm.upload-dir=${UPLOAD_DIR:./uploads}
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
