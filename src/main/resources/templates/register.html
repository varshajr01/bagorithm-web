<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account — Bagorithm</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="photo-page login-page">
<main class="auth-card">
    <a class="brand" th:href="@{/welcome}">BAGORITHM<span>TRAVEL SMARTER</span></a>
    <h1>Create your account</h1><p class="muted">Your trips and travel records stay private to your account.</p>
    <div th:replace="~{fragments :: messages}"></div>
    <form th:action="@{/register}" method="post">
        <label for="name">Full name</label><input id="name" name="name" maxlength="120" autocomplete="name" required>
        <label for="email">Email</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
        <label for="password">Password <span class="muted">(10–72 UTF-8 bytes)</span></label><input id="password" name="password" type="password" minlength="10" maxlength="72" autocomplete="new-password" required>
        <button class="btn btn-primary w-100 mt-3" type="submit">Create account</button>
    </form>
    <p class="auth-foot">Already registered? <a th:href="@{/login}">Sign in</a></p>
</main>
</body>
</html>
